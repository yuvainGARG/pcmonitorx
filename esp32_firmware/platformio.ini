; PCMonitorX firmware for the ESP32-035. Requires PCMonitorX/config.h (copy config.h.example).
[platformio]
default_envs = esp32_035
src_dir = PCMonitorX
include_dir = PCMonitorX

[env:esp32_035]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
lib_deps =
  lovyan03/LovyanGFX@1.2.19
  bblanchon/ArduinoJson@7.4.3
build_flags = -DCORE_DEBUG_LEVEL=0
